name: Build PocketMine Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: phar, mbstring, ctype

      - name: Download DEVirion Script
        run: |
          wget -O devirion.php https://raw.githubusercontent.com/poggit/support/master/virion.php

      - name: Install Virions via Composer
        run: |
          if [ -f composer.json ]; then
            composer install --no-dev --prefer-dist --no-progress
          fi

      - name: Build PHAR with Virions
        run: |
          php devirion.php . CustomNPC.phar

      - name: Upload PHAR
        uses: actions/upload-artifact@v4
        with:
          name: CustomNPC-phar
          path: CustomNPC.phar
