name: Build PocketMine Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: phar, mbstring, ctype, zlib
          ini-values: phar.readonly=0

      - name: Install Box (Phar Builder)
        run: |
          wget https://github.com/box-project/box/releases/download/4.5.1/box.phar -O box
          chmod +x box
          sudo mv box /usr/local/bin/box

      - name: Install Composer Dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --no-dev --prefer-dist --no-progress --ignore-platform-reqs
          fi

      - name: Build PHAR
        run: |
          box compile

      - name: Upload PHAR
        uses: actions/upload-artifact@v4
        with:
          name: CustomNPC-phar
          path: "*.phar"
